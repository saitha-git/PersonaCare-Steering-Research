[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-poc"
version = "0.1.0"
description = "Activation steering POC with an ONNX/Qualcomm deployment path"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "numpy",
    "pyyaml",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "matplotlib",
    "safetensors",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
qualcomm = ["qai-hub"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
